plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.wipeguard'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.wipeguard"
        minSdk 26
        targetSdk 30
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
